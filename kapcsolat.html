/* Fő cím */
.title-container{
    text-align: center;
    margin-top: 100px;
    margin-bottom: 50px;
}

h2{
    color: rgba(255,255,255,0.9);
    text-shadow: 0px 2px 4px #16151565;
}

.underline{
    width: 60px;
    height: 3px;
    background-color: rgba(255,255,255,0.9);
    margin: 10px auto;
}

/* Kontakt szekció */
.contact-info{
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 40px;
    flex-wrap: wrap;
    text-align: center;
    width: 100%;
}

/* Kártyák */
.contact-box{
    width: 250px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Kör ikon */
.circle{
    width: 70px;
    height: 70px;
    background-color: rgba(255,255,255,0.15);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(5px);
    margin-bottom: 15px;
}

.ikonok{
    width: 32px;
    height: 32px;
}

/* Szöveg */
.kapcsolat{
    color: white;
    text-align: center;
    font-size: 17px;
    line-height: 1.5;
    margin: 0;
    width: 100%;
}

/* Mobil nézet */
@media (max-width: 768px){

    .contact-info{
        flex-direction: column;
        align-items: center;
        gap: 30px;
    }

    .contact-box{
        width: 100%;
        max-width: 300px;
    }

    .title-container{
        margin-top: 120px;
    }
}

/* Footer */
footer{
